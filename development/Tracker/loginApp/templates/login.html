{% extends 'normalBase.html' %}

{% block body %}
    <section>
        <form action="{% url 'loginView' %}" method="post" class="purpleForm">
            {% csrf_token %}

            <h3>Login</h3>
            <label for="email">Email Address :</label>
            <input type="email" name="email" id="email" placeholder="ex. : example123@mail.com" required>
            <label for="password">Password :</label>
            <input type="password" name="password" id="password" placeholder="Enter you password" required>

            <button class="purpleButton" type="submit">Login</button>
        </form>
        <svg width="420" height="420" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="160" cy="260" r="150" fill="#9747FF" fill-opacity="0.3"/>
            <circle cx="160" cy="260" r="155" stroke="#9747FF" stroke-opacity="0.1" stroke-width="10"/>
            <circle cx="260" cy="160" r="150" fill="#6AE895" fill-opacity="0.6"/>
            <circle cx="260" cy="160" r="155" stroke="#A3F1BD" stroke-opacity="0.3" stroke-width="10"/>
        </svg>
    </section>
    <div class="notHere">
        <span>Not yet registered? please go to</span>
        <a href="{% url 'registrationView' %}">
            <button class="greenButton">Registration</button>
        </a>
    </div>
{% endblock %}
